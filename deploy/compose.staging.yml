# Rundinova Studio — préproduction (projet compose « rundinova-studio-staging »).
# Installé sur le VPS : /opt/rundinova-studio-staging/compose.yml. ARRÊTÉE PAR DÉFAUT :
#   /opt/rundinova-studio-staging/staging.sh up | down | status | logs
#
# Hôtes : staging-<vendeur>.rundinova.com, staging-admin…, staging-espace…, staging-isoko…
# (bloc nginx unique, protégé par mot de passe). App sur 127.0.0.1:19301.
# Budget : app 512 Mo / 0,5 CPU, base dédiée 160 Mo / 0,25 CPU (jamais la base de production).
# Après un redémarrage du VPS, la préproduction NE redémarre PAS (restart on-failure).

name: rundinova-studio-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-image: &image ghcr.io/jubuniyokodev/rundinova-studio:${TAG:-staging}

services:
  db:
    image: postgres:16-alpine
    container_name: rundinova-studio-staging-db
    restart: on-failure:3
    environment:
      POSTGRES_USER: studio
      POSTGRES_DB: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=96MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_connections=20
      - -c
      - max_wal_size=128MB
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - jit=off
    volumes:
      - ${STUDIO_DIR:-/opt/rundinova-studio-staging}/db:/var/lib/postgresql/data
    shm_size: 32m
    mem_limit: 160m
    memswap_limit: 160m
    cpus: 0.25
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio -q"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *logging

  migrate:
    image: *image
    restart: "no"
    command: ["node", "--disable-warning=ExperimentalWarning", "/app/migrator/scripts/db-migrate.mts"]
    environment:
      DATABASE_URL: postgres://studio:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}@db:5432/studio
      NODE_OPTIONS: --max-old-space-size=128
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  app:
    image: *image
    container_name: rundinova-studio-staging
    restart: on-failure:3
    init: true
    env_file:
      - path: ${STUDIO_DIR:-/opt/rundinova-studio-staging}/.env
        required: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=320
      DATABASE_URL: postgres://studio:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}@db:5432/studio
      TRUST_FORWARDED_HOST: "1"
      UPLOADS_DIR: /data/uploads
      CERT_REQUESTS_DIR: /data/cert-requests
      CERT_STATUS_DIR: /data/cert-status
      HEALTH_STATUS_FILE: /data/status/health.json
    ports:
      - "127.0.0.1:19301:3000"
    volumes:
      - ${STUDIO_DIR:-/opt/rundinova-studio-staging}/uploads:/data/uploads
      - ${STUDIO_DIR:-/opt/rundinova-studio-staging}/cert-requests:/data/cert-requests
      - ${STUDIO_DIR:-/opt/rundinova-studio-staging}/cert-status:/data/cert-status:ro
      - ${STUDIO_DIR:-/opt/rundinova-studio-staging}/status:/data/status:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 15s
    logging: *logging
