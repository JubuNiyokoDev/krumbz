# Rundinova Studio — définitions au niveau `http` (installé dans /etc/nginx/conf.d/).
# Uniquement des noms préfixés rundinova_studio / rs_ : aucun effet sur les 43 autres sites
# tant qu'aucun bloc serveur ne les utilise (seul zz-rundinova-studio.conf les utilise).

# Cache disque dédié (pas de CDN) : fichiers statiques, uploads, modèles 3D, images optimisées.
# Index en mémoire partagée 20 Mo (~160 000 clés), disque ≤ 2 Go, entrées inutilisées 30 j.
proxy_cache_path /var/cache/nginx/rundinova_studio levels=1:2 keys_zone=rundinova_studio:20m
                 max_size=2g inactive=30d use_temp_path=off;

upstream rundinova_studio {
    server 127.0.0.1:19300 max_fails=0;
    keepalive 16;
}

upstream rundinova_studio_staging {
    server 127.0.0.1:19301 max_fails=0;
    keepalive 4;
}

# Production ou préproduction selon l'hôte (« staging-* » ne peut pas être un joker nginx :
# le tri se fait ici, dans un seul bloc serveur).
map $host $rs_upstream {
    default                                     rundinova_studio;
    ~^staging(-[a-z0-9-]+)?\.rundinova\.com$    rundinova_studio_staging;
}

# Préproduction protégée par mot de passe ; « off » désactive auth_basic pour la production.
map $rs_upstream $rs_auth {
    default                     off;
    rundinova_studio_staging    "Rundinova Studio - preproduction";
}

map $rs_upstream $rs_robots {
    default                     "";
    rundinova_studio_staging    "noindex, nofollow";
}

# Nom de certificat assaini (un seul niveau sous rundinova.com) : jamais de chemin arbitraire
# dérivé du SNI. Tout autre nom → dossier inexistant → poignée de main refusée pour ce nom.
map $ssl_server_name $rs_cert_host {
    default                                     _invalid;
    ~^(?<rs_h>[a-z0-9-]+\.rundinova\.com)$      $rs_h;
}

# Hôtes d'AUTRES projets (plan §1) + site officiel. Ils ont leurs propres vhosts aux noms exacts,
# prioritaires sur le joker : ce garde-fou ne sert que si l'un d'eux disparaît un jour — la
# plateforme répond alors 421 au lieu de servir une page Rundinova Studio à leur place.
map $host $rs_foreign {
    hostnames;
    default                 0;
    rundinova.com           1;
    www.rundinova.com       1;
    .koraneza.rundinova.com 1;  # koraneza + demo.koraneza
    chat.rundinova.com      1;
    livekit.rundinova.com   1;
    livekit-admin.rundinova.com 1;
    workspace.rundinova.com 1;
    cdn.rundinova.com       1;
    storage.rundinova.com   1;
    s3.rundinova.com        1;
    tableyawe.rundinova.com 1;
    tableyawe-api.rundinova.com 1;
    shopsync.rundinova.com  1;
    games.rundinova.com     1;
    realtime.rundinova.com  1;
    central.rundinova.com   1;
    tech.rundinova.com      1;
    mail.rundinova.com      1;
}

# Format d'image négocié (Accept) : fait partie de la clé de cache de /_next/image.
map $http_accept $rs_img_fmt {
    default         orig;
    ~image/avif     avif;
    ~image/webp     webp;
}
