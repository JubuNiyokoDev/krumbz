# Rundinova Studio — défi HTTP-01 pour un hôte de NOTRE projet servi par son propre vhost
# (krumbz.rundinova.com tant que son vhost existe). À inclure dans le bloc server 443 de ce
# vhost : son port 80 (généré par certbot) redirige vers HTTPS et Let's Encrypt suit la
# redirection. N'affecte que /.well-known/acme-challenge/ (ce chemin n'existe pas dans l'app).
location ^~ /.well-known/acme-challenge/ {
    root /var/www/rundinova-studio-acme;
    default_type text/plain;
    try_files $uri =404;
}
