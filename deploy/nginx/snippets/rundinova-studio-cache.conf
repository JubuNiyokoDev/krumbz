# Rundinova Studio — réglages communs aux emplacements mis en cache (zz-rundinova-studio-https.conf).
# Installé dans /etc/nginx/snippets/. Un `add_header` dans un location annule l'héritage de ceux
# du serveur : HSTS et X-Robots-Tag sont donc répétés ici.
proxy_cache_lock on;
proxy_cache_lock_timeout 10s;
proxy_cache_revalidate on;
proxy_cache_background_update on;
# Pendant un redémarrage de l'app, servir la copie en cache plutôt qu'une erreur.
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
add_header X-Cache-Status $upstream_cache_status always;
# Sans includeSubDomains : ne doit rien imposer aux autres sous-domaines (autres projets).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Robots-Tag $rs_robots always;
