# PRÉPRODUCTION SEULEMENT (accord du propriétaire du 2026-11-22) : 5 noms explicites, AUCUN joker.
# Remplacé par zz-rundinova-studio-https.conf lors de la mise en production (étape 10 du plan).
# Rundinova Studio — port 443 (étape C de deploy/nginx/APPLY.md, APRÈS l'émission des
# certificats d'isoko/admin/espace par le port 80). Même règles de priorité et même
# préfixe « zz- » que zz-rundinova-studio-http.conf (lire ses commentaires).
#
# Certificats chargés À LA VOLÉE (variables, nginx ≥ 1.15.9 ; VPS : 1.24) : un certificat
# déposé par cert-deploy-hook.sh dans /etc/rundinova-studio/certs/<hôte>/ est utilisé dès
# la poignée de main suivante, SANS recharger nginx. Un hôte sans certificat échoue à la
# poignée de main (et seulement lui). Lecture par les workers (www-data) : dossiers 0750 et
# fichiers 0640 root:www-data.
#
# Volontairement absents :
#  - `http2` : sur nginx 1.24 c'est une option de `listen`, partagée par TOUS les vhosts du
#    port 443 ; l'activer ici changerait le protocole des autres sites.
#  - `ssl_stapling` : incompatible avec des certificats en variables.
#  - `listen [::]:443` : voir le commentaire IPv6 du fichier http.

server {
    listen 443 ssl;
    # listen [::]:443 ssl;

    server_name staging.rundinova.com staging-krumbz.rundinova.com staging-ikirenge.rundinova.com
                staging-admin.rundinova.com staging-espace.rundinova.com;

    ssl_certificate     /etc/rundinova-studio/certs/$rs_cert_host/fullchain.pem;
    ssl_certificate_key /etc/rundinova-studio/certs/$rs_cert_host/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:rundinova_studio_ssl:5m;
    ssl_session_timeout 1d;

    if ($rs_foreign) {
        return 421;
    }

    # HSTS sans includeSubDomains : ne doit rien imposer aux sous-domaines des autres projets.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Préproduction : jamais indexée (valeur vide = en-tête absent en production).
    add_header X-Robots-Tag $rs_robots always;

    # Préproduction (staging*) : mot de passe (fichier créé à l'installation, voir APPLY.md).
    auth_basic           $rs_auth;
    auth_basic_user_file /etc/rundinova-studio/staging.htpasswd;

    client_max_body_size 25m;      # photos produits (compressées ensuite par sharp)

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;   # indispensable : l'app choisit la boutique d'après Host
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # Préproduction arrêtée (cas normal) ou app en redémarrage : message clair.
    error_page 502 504 = @rs_unavailable;

    location / {
        proxy_pass http://$rs_upstream;
    }

    # --- Cache nginx dédié (pas de CDN) ------------------------------------------------
    # La durée vient des en-têtes de l'app (Cache-Control immutable pour les fichiers
    # versionnés) ; proxy_cache_valid ne sert que si l'app n'en envoie pas. Les réponses avec
    # Set-Cookie ne sont jamais mises en cache (défaut nginx). Clé : upstream (prod/staging
    # ont des builds différents) + hôte quand le contenu dépend de la boutique.

    # Fichiers du build (noms hachés, identiques pour toutes les boutiques).
    location ^~ /_next/static/ {
        proxy_pass http://$rs_upstream;
        proxy_cache rundinova_studio;
        proxy_cache_key $rs_upstream$uri;
        proxy_cache_valid 200 30d;
        include /etc/nginx/snippets/rundinova-studio-cache.conf;
    }

    # Images optimisées par Next (sharp) : le cache évite de recalculer (CPU).
    location = /_next/image {
        proxy_pass http://$rs_upstream;
        proxy_cache rundinova_studio;
        proxy_cache_key $rs_upstream$host$request_uri$rs_img_fmt;
        proxy_cache_valid 200 7d;
        include /etc/nginx/snippets/rundinova-studio-cache.conf;
    }

    # Photos des vendeurs (noms uniques générés à l'envoi) et boutique de démonstration :
    # immuables 1 an pour le navigateur (pas de CDN : c'est le cache client qui soulage le VPS).
    location ~ ^/(uploads|demo)/ {
        proxy_pass http://$rs_upstream;
        proxy_cache rundinova_studio;
        proxy_cache_key $rs_upstream$host$uri;
        proxy_cache_valid 200 30d;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/rundinova-studio-cache.conf;
    }

    # Modèles 3D, textures, images du dépôt (Krumbz : noms NON versionnés) : la durée vient de
    # l'app (next.config.ts : 1 j + stale-while-revalidate ; basis/vendor : immutable).
    # Les passer en immutable exige d'abord des noms versionnés (sinon une image remplacée
    # resterait périmée jusqu'à 1 an chez les visiteurs).
    location ~ ^/(models|textures|images|basis|vendor)/ {
        proxy_pass http://$rs_upstream;
        proxy_cache rundinova_studio;
        proxy_cache_key $rs_upstream$host$uri;
        proxy_cache_valid 200 1d;
        include /etc/nginx/snippets/rundinova-studio-cache.conf;
    }

    location @rs_unavailable {
        default_type text/html;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        return 503 '<!doctype html><meta charset="utf-8"><title>Indisponible</title><p style="font:16px system-ui;margin:3rem auto;max-width:32rem">Service momentanément indisponible (redémarrage ou préproduction arrêtée). Réessayez dans une minute.</p>';
    }
}
