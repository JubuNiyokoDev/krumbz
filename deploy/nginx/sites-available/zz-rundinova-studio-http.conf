# Rundinova Studio — port 80 (étape A de deploy/nginx/APPLY.md).
# Installé dans /etc/nginx/sites-available/, lien dans sites-enabled/.
#
# POURQUOI « zz- » : nginx inclut sites-enabled/* dans l'ordre alphabétique et, sans
# `default_server` (cas du VPS), le PREMIER bloc d'un port devient le serveur par défaut.
# Le préfixe zz- garantit que ce fichier ne devient jamais le défaut : rien ne change pour
# les requêtes qui ne nomment pas un hôte de la plateforme.
#
# PRIORITÉ DES NOMS (doc nginx « server_name ») : 1) nom exact, 2) joker en tête le plus
# long, 3) joker en fin, 4) regex. Les vhosts des autres projets (koraneza.rundinova.com,
# chat.rundinova.com, krumbz.rundinova.com, …) sont des noms EXACTS : ils gardent la
# priorité sur *.rundinova.com. « *.rundinova.com » ne correspond PAS à « rundinova.com »
# (site officiel), et www.rundinova.com est un nom exact de son propre vhost : les deux
# restent servis par leur vhost actuel, intact (vérifié par APPLY.md, contrôle C3).

server {
    listen 80;
    # IPv6 : seulement si les autres vhosts écoutent déjà [::]:80 (APPLY.md, contrôle C5),
    # sinon ce bloc deviendrait le défaut IPv6. Le DNS joker n'a qu'un enregistrement A.
    # listen [::]:80;

    # « staging-*.rundinova.com » n'est pas un joker valide pour nginx (* seulement en tête
    # ou en fin) : ces hôtes sont couverts par *.rundinova.com et triés par $rs_upstream.
    server_name isoko.rundinova.com admin.rundinova.com espace.rundinova.com
                staging.rundinova.com *.rundinova.com;

    # Validation HTTP-01 Let's Encrypt (cert-provision.sh → certbot --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rundinova-studio-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        if ($rs_foreign) {
            return 421;
        }
        return 301 https://$host$request_uri;
    }
}
