# Deployed as-is to /opt/krumbz on the VPS by .github/workflows/deploy.yml.
# nginx (host) terminates TLS and proxies to 127.0.0.1:19200.
services:
  app:
    image: ghcr.io/jubuniyokodev/krumbz:latest
    container_name: krumbz
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_SITE_URL: https://krumbz.rundinova.com
    ports:
      - "127.0.0.1:19200:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
