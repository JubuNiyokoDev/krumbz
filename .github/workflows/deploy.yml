# Déploiement de production de la plateforme Rundinova Studio (toutes les boutiques, isoko,
# admin, espace) sur push main :
# 1. verify (ci.yml) et build (image ghcr.io/jubuniyokodev/rundinova-studio:sha-<7>) en parallèle ;
# 2. deploy : « latest » → sha-<7>, puis sur le VPS /opt/rundinova-studio : scripts/deploy.sh
#    (sauvegarde, migrations, contrôle de santé, retour arrière automatique en cas d'échec).
# Retour arrière manuel : Actions → Deploy → Run workflow → tag = sha-<7> d'un déploiement précédent.
# La suite Playwright complète tourne la nuit (e2e-nightly.yml), sans bloquer.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Retour arrière : tag existant à redéployer (ex. sha-1a2b3c4). Vide = construire le commit courant."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  STUDIO_IMAGE: ghcr.io/jubuniyokodev/rundinova-studio
  SITE_URL: https://krumbz.rundinova.com

jobs:
  verify:
    if: inputs.tag == ''
    uses: ./.github/workflows/ci.yml

  build:
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
          tags: |
            ${{ env.STUDIO_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [verify, build]
    if: >-
      always() && !cancelled() &&
      (inputs.tag != '' || (needs.verify.result == 'success' && needs.build.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag != '' && inputs.tag || needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag
        run: |
          [[ "$TAG" =~ ^sha-[0-9a-f]{7,40}$ ]] || { echo "tag invalide : $TAG"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote ${{ env.TAG }} to latest (rundinova-studio)
        run: docker buildx imagetools create -t "$STUDIO_IMAGE:latest" "$STUDIO_IMAGE:$TAG"

      - name: Upload compose file and ops scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/compose.production.yml,scripts/ops/*.sh"
          target: "/opt/rundinova-studio/.incoming"
          rm: true

      - name: Deploy (backup, migrations, health check, automatic rollback)
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ env.TAG }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TAG,GITHUB_SHA
          command_timeout: 12m
          script: |
            set -euo pipefail
            cd /opt/rundinova-studio
            install -d -m 755 scripts
            install -m 755 .incoming/scripts/ops/*.sh scripts/
            rm -f scripts/selftest-*.sh
            install -m 644 .incoming/deploy/compose.production.yml compose.yml
            rm -rf .incoming
            scripts/deploy.sh production "$TAG"
